[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "langchain-renoun"
version = "0.1.0"
description = "LangChain tools for ReNoUn structural market regime classification"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [
    { name = "Harrison Collab", email = "98lukehall@gmail.com" },
]
keywords = [
    "langchain",
    "crypto",
    "trading",
    "risk",
    "regime",
    "structural-analysis",
    "market-regime",
    "renoun",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "langchain-core>=0.1.0",
]

[project.urls]
Homepage = "https://harrisoncollab.com"
Documentation = "https://harrisoncollab.com/agents"
Repository = "https://github.com/98lukehall/langchain-renoun"
Issues = "https://github.com/98lukehall/langchain-renoun/issues"

[tool.hatch.build.targets.wheel]
packages = ["langchain_renoun"]
